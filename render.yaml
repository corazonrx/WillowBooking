services:
  - type: web
    name: willow-booking
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: python -m pip install -r backend/requirements.txt
    startCommand: bash scripts/start-render.sh
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: willow-booking-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: HOTEL_TIMEZONE
        value: Europe/Warsaw
      - key: ACCESS_TOKEN_MINUTES
        value: "15"
      - key: REFRESH_TOKEN_DAYS
        value: "7"

databases:
  - name: willow-booking-db
    plan: free
    region: frankfurt
    postgresMajorVersion: "17"
    databaseName: willow_booking
    user: willow_user
    ipAllowList: []
