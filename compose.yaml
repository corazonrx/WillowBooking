name: hotel-booking
services:
  db:
    image: postgres:17
    env_file: backend/.env
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - hotel_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  hotel_data:
